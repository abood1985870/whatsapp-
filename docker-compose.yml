services:
  postgres:
    image: ankane/pgvector:latest
    container_name: qanoai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qanoai
      POSTGRES_PASSWORD: qanoai_dev_password
      POSTGRES_DB: qanoai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qanoai -d qanoai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qanoai-network

  redis:
    image: redis:7-alpine
    container_name: qanoai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qanoai-network

  minio:
    image: minio/minio:latest
    container_name: qanoai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: qanoai-minio
      MINIO_ROOT_PASSWORD: qanoai-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qanoai-network

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 qanoai-minio qanoai-minio-password;
      /usr/bin/mc mb myminio/qanoai-private || true;
      /usr/bin/mc policy set private myminio/qanoai-private;
      exit 0;
      "
    networks:
      - qanoai-network

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: qanoai-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: evolution_api_key_change_in_production
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      # Evolution API v2 requires a database; it gets its own DB in the shared
      # Postgres instance (created out-of-band: CREATE DATABASE evolution)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://qanoai:qanoai_dev_password@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: qanoai-evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - qanoai-network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: qanoai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3001:3001"
    networks:
      - qanoai-network

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: qanoai-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - qanoai-network

  realtime:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.realtime
    container_name: qanoai-realtime
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3002:3002"
    networks:
      - qanoai-network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: qanoai-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - qanoai-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  evolution_data:

networks:
  qanoai-network:
    driver: bridge
